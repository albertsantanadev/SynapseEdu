name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-mock

      - name: Lint with flake8
        run: flake8 app --max-line-length=100 --extend-ignore=E203

      - name: Check formatting with black
        run: black --check app

      - name: Run tests
        run: pytest -v
        env:
          DATABASE_URL: sqlite:///./test.db
          GROQ_API_KEY: fake-key-for-ci